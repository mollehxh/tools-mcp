[workspace]
members = [
    "crates/mcp-agent-authority",
    "crates/codex-tools-runtime",
    "crates/skill-store",
    "crates/mcp-agent-server",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
cap-std = "4.0.2"
cap-primitives = "4.0.2"
libc = "0.2.177"
pretty_assertions = "1.4.1"
rmcp = { version = "=3.0.1", features = ["client", "reqwest", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7.16"
toml = "0.9.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace]
members = [
    "crates/mcp-agent-authority",
    "crates/mcp-agent-tool-contracts",
    "crates/mcp-agent-local-backend",
    "crates/mcp-agent-vps-backend",
    "crates/mcp-agent-vps-runner",
    "crates/mcp-agent-windows-sandbox",
    "crates/mcp-agent-relay",
    "crates/mcp-agent-gateway",
    "crates/codex-tools-runtime",
    "crates/skill-store",
    "crates/mcp-agent-server",
    "crates/mcp-agent",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
axum = "0.8.6"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22.1"
futures-util = "0.3.31"
hmac = "0.12.1"
flate2 = "1.1.5"
cap-std = "4.0.2"
cap-primitives = "4.0.2"
libc = "0.2.177"
nix = { version = "0.28.0", features = ["fs", "resource", "user"] }
pretty_assertions = "1.4.1"
portable-pty = "0.9.0"
rand = "0.9.2"
rcgen = { version = "0.14.5", default-features = false, features = ["pem"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "query", "rustls"] }
rustls = "0.23.43"
rustls-pki-types = "1.13.1"
rustls-pemfile = "2.2.0"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
tokio-rustls = "0.26.4"
rustix = { version = "1.1.4", features = ["fs"] }
rmcp = { version = "=3.0.1", features = ["client", "reqwest", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.23.0"
tar = "0.4.44"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.16"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
toml = "0.9.8"
url = "2.5.7"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

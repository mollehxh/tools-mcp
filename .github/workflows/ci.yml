name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo run -p xtask -- conformance
      - run: cargo run -p xtask -- package
      - run: cargo run -p xtask -- inspector-smoke
      - run: cargo tree -d

  unsupported-platforms:
    name: Linux and Windows deferred
    runs-on: ubuntu-latest
    steps:
      - run: echo "Linux and Windows native release support is intentionally deferred; no artifact is claimed."
